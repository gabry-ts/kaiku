name: Kaiku
options:
  bundleIdPrefix: com.gabrielepartiti.kaiku
  deploymentTarget:
    iOS: "26.0"
settings:
  base:
    DEVELOPMENT_TEAM: X3G5QJ3P5A
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  Kaiku:
    path: ..
targets:
  KaikuiOS:
    type: application
    platform: iOS
    sources:
      - Kaiku
      - Shared
    dependencies:
      - package: Kaiku
        product: KaikuCore
      - framework: vendor/whisper.xcframework
        embed: true
      - target: Widgets
      - target: Share
      - target: Broadcast
    settings:
      base:
        PRODUCT_NAME: Kaiku
        PRODUCT_BUNDLE_IDENTIFIER: com.gabrielepartiti.kaiku.ios
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
    info:
      path: Kaiku/Info.plist
      properties:
        CFBundleDisplayName: Kaiku
        UILaunchScreen: {}
        UIBackgroundModes:
          - audio
        NSMicrophoneUsageDescription: Kaiku records meetings with the microphone.
        NSSpeechRecognitionUsageDescription: Kaiku transcribes recordings with the speech recognizer on this iPhone.
        NSLocalNetworkUsageDescription: Kaiku connects to transcription and AI servers on your local network.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        BGTaskSchedulerPermittedIdentifiers:
          - com.gabrielepartiti.kaiku.ios.transcribe.*
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        ITSAppUsesNonExemptEncryption: false
        NSSupportsLiveActivities: true
    entitlements:
      path: Kaiku/Kaiku.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.gabrielepartiti.kaiku.ios
  Widgets:
    type: app-extension
    platform: iOS
    sources:
      - Widgets
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gabrielepartiti.kaiku.ios.widgets
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: Kaiku
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widgets/Widgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.gabrielepartiti.kaiku.ios
  Share:
    type: app-extension
    platform: iOS
    sources:
      - Share
      - Shared/AppGroup.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gabrielepartiti.kaiku.ios.share
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
    info:
      path: Share/Info.plist
      properties:
        CFBundleDisplayName: Add to Kaiku
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule: 'SUBQUERY (extensionItems, $item, SUBQUERY ($item.attachments, $a, ANY $a.registeredTypeIdentifiers UTI-CONFORMS-TO "public.audio" || ANY $a.registeredTypeIdentifiers UTI-CONFORMS-TO "public.movie" || ANY $a.registeredTypeIdentifiers UTI-CONFORMS-TO "com.apple.m4a-audio").@count > 0 AND $item.attachments.@count <= 20).@count > 0'
    entitlements:
      path: Share/Share.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.gabrielepartiti.kaiku.ios
  Broadcast:
    type: app-extension
    platform: iOS
    sources:
      - Broadcast
      - Shared/AppGroup.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gabrielepartiti.kaiku.ios.broadcast
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
    info:
      path: Broadcast/Info.plist
      properties:
        CFBundleDisplayName: Kaiku
        NSExtension:
          NSExtensionPointIdentifier: com.apple.broadcast-services-upload
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).SampleHandler
          RPBroadcastProcessMode: RPBroadcastProcessModeSampleBuffer
    entitlements:
      path: Broadcast/Broadcast.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.gabrielepartiti.kaiku.ios
schemes:
  Kaiku:
    build:
      targets:
        KaikuiOS: all
    run:
      config: Debug
    archive:
      config: Release
